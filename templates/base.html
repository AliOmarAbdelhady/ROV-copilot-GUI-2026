<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ROV Copilot{% endblock %} — Iceberg Threat Assessment</title>
    <script>
        const savedTheme = localStorage.getItem('rov-theme');
        document.documentElement.classList.toggle('dark', savedTheme !== 'light');
    </script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --primary: 221.2 83.2% 53.3%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 221.2 83.2% 53.3%;
            --radius: 0.5rem;
        }
        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --card: 222.2 84% 4.9%;
            --card-foreground: 210 40% 98%;
            --primary: 217.2 91.2% 59.8%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 224.3 76.3% 48%;
        }
        body { background-color: hsl(var(--background)); color: hsl(var(--foreground)); }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 w-full border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60">
        <div class="flex h-14 items-center px-6">
            <div class="flex items-center gap-3">
                <svg class="h-6 w-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <h1 class="text-lg font-semibold tracking-tight">ROV Copilot</h1>
                <span class="text-xs text-muted-foreground ml-2">2026 MATE ROV Competition</span>
            </div>
            <nav class="ml-8 hidden items-center gap-2 md:flex">
                <a href="{{ url_for('index') }}"
                    class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors {% if active_page == 'dashboard' %}bg-primary text-primary-foreground{% else %}text-muted-foreground hover:bg-accent hover:text-foreground{% endif %}">
                    Dashboard
                </a>
                <a href="{{ url_for('frequency') }}"
                    class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors {% if active_page == 'frequency' %}bg-primary text-primary-foreground{% else %}text-muted-foreground hover:bg-accent hover:text-foreground{% endif %}">
                    Frequency Mission
                </a>
            </nav>
            <div class="ml-auto flex items-center gap-2">
                {% if show_export_buttons %}
                <button id="btn-export-csv" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-sm font-medium hover:bg-accent transition-colors">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    CSV
                </button>
                <button id="btn-export-pdf" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-sm font-medium hover:bg-accent transition-colors">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    PDF
                </button>
                {% endif %}
                <button id="btn-theme-toggle" class="inline-flex items-center justify-center rounded-md border border-border bg-background w-9 h-9 hover:bg-accent transition-colors">
                    <svg class="h-4 w-4 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    <svg class="h-4 w-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </button>
            </div>
        </div>
        <div class="border-t border-border px-4 py-2 md:hidden">
            <div class="flex gap-2">
                <a href="{{ url_for('index') }}"
                    class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors {% if active_page == 'dashboard' %}bg-primary text-primary-foreground{% else %}text-muted-foreground hover:bg-accent hover:text-foreground{% endif %}">
                    Dashboard
                </a>
                <a href="{{ url_for('frequency') }}"
                    class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors {% if active_page == 'frequency' %}bg-primary text-primary-foreground{% else %}text-muted-foreground hover:bg-accent hover:text-foreground{% endif %}">
                    Frequency
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
